# SonarCloud Automatic Analysis settings.
#
# design-review/ holds static design-canvas mockups (one HTML file per screen
# state, so markup and element ids repeat by design) and the local tool that
# renders them, which executes the mockups' own component scripts. None of it
# ships in the app. Excluding it keeps the quality gate about product code.
# Owner decision: Robert, 2026-11-11 (PR #1166 Sonar review).
sonar.exclusions=design-review/**
sonar.cpd.exclusions=design-review/**
