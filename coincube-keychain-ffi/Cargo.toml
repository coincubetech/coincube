[package]
name = "coincube-keychain-ffi"
version = "0.1.0"
authors = ["Coincube Team"]
edition = "2021"
repository = "https://github.com/coincubetech/coincube"
license-file = "../LICENCE"
description = "C ABI over coincube-core's unified sighash and P2WSH unified signing, for the Keychain phone signer"
publish = false

[dependencies]
# The only dependency, deliberately. Everything this crate needs from the
# bitcoin/miniscript/bip39 stack comes through coincube-core's re-exports
# (`pub use bip39`, `pub use miniscript`), so the two halves of the FFI can
# never be built against different versions of the consensus types.
coincube-core = { path = "../coincube-core" }

[dev-dependencies]
serde_json = "1.0"

[lints.clippy]
# A C ABI is a flat parameter list: buffers travel as (pointer, length) pairs
# and there is no way to group them without inventing structs that the Dart
# side would then have to lay out by hand. The alternative to this allow is a
# worse boundary, not fewer arguments.
too_many_arguments = "allow"

[lib]
# `rlib` keeps the integration tests (and any future Rust consumer) able to
# link it; `staticlib` is what iOS links into its framework; `cdylib` is what
# Android packages per ABI in `jniLibs`. All three export the same symbols, so
# the known-answer test in `tests/` exercises the shipped boundary.
crate-type = ["rlib", "staticlib", "cdylib"]
doctest = false
