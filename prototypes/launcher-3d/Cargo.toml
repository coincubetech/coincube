[package]
name = "tenshu-launcher-3d"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately independent: no wallet, daemon, API or Breez dependencies.
[workspace]

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tokio", "advanced"] }
iced_wgpu = "=0.14.0"
glam = "=0.25.0"
bytemuck = { version = "1.25", features = ["derive"] }

[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"
