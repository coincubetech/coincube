    "regex",
    "tokio",
    "ledger_bitcoin_client",
    "ledger-transport-hidapi",
    "ledger-apdu",
    "hidapi",
]
regex = ["dep:regex"]
service = [
    "bitbox",
    "coldcard",
    "jade",
    "ledger",
    "specter",
    "tracing",
    "hex",
    "crossbeam",
]
