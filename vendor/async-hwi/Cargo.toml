[package]
edition = "2018"
name = "async-hwi"
version = "0.0.32"
authors = ["Edouard Paris <m@edouard.paris>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async hardware wallet interface"
