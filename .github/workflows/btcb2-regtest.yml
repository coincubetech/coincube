name: BTCB2 Regtest Harness

# The two-chain Bitcoin Blake2b harness (tests/test_btcb2_harness.py) builds a
# BLAKE2b-aware Esplora indexer from source and downloads two Bitcoin Knots
# releases, so it only runs on pull requests carrying the `btcb2` label or when
# dispatched by hand — never on every push — to protect Actions minutes.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      trace_syscalls:
        description: >-
          Run both Knots nodes under strace (per-thread openat/lseek/read/
          close/dup) and keep the trace with the failure logs. Investigation
          only: it multiplies the run's wall time (#394).
        type: boolean
        default: false
      probe_only:
        description: >-
          Run only the concurrent getblock block-file probe. Skips the
          coincubed and electrs builds, so a reproduction attempt costs a Knots
          download and a few minutes instead of a full harness run.
        type: boolean
        default: false
      repeat:
        description: >-
          Run the selected tests this many times (1-10), stopping at the first
          failure. For an intermittent fault; every attempt costs Actions
          minutes.
        type: string
        default: "1"
      probe_threads:
        description: >-
          Concurrent senders in the block-file probe. The node runs with
          rpcthreads=32, and the runner has two cores, so a higher number
          oversubscribes both on purpose.
        type: string
        default: ""
      probe_batch:
        description: >-
          getblock calls per JSON-RPC batch in the probe. 100 is electrs's
          shape; 1 trades batching for hundreds of short-lived connections,
          which is the other half of what electrs does to the node.
        type: string
        default: ""
      probe_rounds:
        description: Passes over the chain per sender in the probe.
        type: string
        default: ""

concurrency:
  group: btcb2-regtest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Checkout, caches and the failure-log artifact need nothing beyond reading
# the repository.
permissions:
  contents: read

env:
  KNOTS_LEGACY_VERSION: 29.3.knots20260507
  KNOTS_BLAKE2B_VERSION: 29.4.1.knots20260508
  ELECTRS_BLAKE2B_COMMIT: 4453cac61979322c0260f4b90e899379ae606206

jobs:
  btcb2-harness:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'btcb2')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          # rust-toolchain.toml lists these; installing them here (as
          # integration.yml does) avoids rustup adding them at first cargo
          # invocation, which conflicts with the action's bin/cargo-fmt.
          components: rustfmt, clippy

      # --no-install-recommends omits protoc's standard imports unless explicit.
      - name: Install build dependencies (rocksdb for electrs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev cmake libudev-dev libfontconfig1-dev pkg-config libdbus-1-dev protobuf-compiler libprotobuf-dev libwebkit2gtk-4.1-dev

      - name: Install strace
        if: ${{ inputs.trace_syscalls }}
        run: sudo apt-get install -y --no-install-recommends strace

      - name: Setup Python dependencies
        run: pip install --break-system-packages -r tests/requirements.txt

      - name: Cache target/
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-target-

      - name: Cache knots_verify
        uses: actions/cache@v5
        with:
          path: tests/tools/knots_verify/target/release/knots_verify
          key: ${{ runner.os }}-knots-verify-${{ hashFiles('tests/tools/knots_verify/Cargo.lock', 'tests/tools/knots_verify/src/main.rs', 'coincube-gui/assets/knots_signing_key.asc') }}

      - name: Cache Knots releases
        uses: actions/cache@v5
        with:
          path: tests/tools/knots
          # Bound to the same verifier inputs as the knots_verify cache above
          # (its source, its lock file, the vendored signing key), so a change
          # to the trust anchor or the verifier can never be paired with
          # archives that only an older verifier ever checked. This is
          # belt-and-braces: fetch_knots.sh keeps no "verified" marker and
          # re-verifies the cached archive with the current verifier on every
          # run, comparing the extracted bitcoind against the archive member —
          # nothing within a key generation is trusted on a stored digest
          # either. Cost: the archives are re-downloaded only when a verifier
          # input or a pinned version changes, not per run.
          key: ${{ runner.os }}-knots-v2-${{ env.KNOTS_LEGACY_VERSION }}-${{ env.KNOTS_BLAKE2B_VERSION }}-${{ hashFiles('tests/tools/knots_verify/Cargo.lock', 'tests/tools/knots_verify/src/main.rs', 'coincube-gui/assets/knots_signing_key.asc') }}

      - name: Cache electrs (BLAKE2b) build
        uses: actions/cache@v5
        with:
          # Built outside the checkout: inside it Cargo would treat the electrs
          # crate as a member of Coincube's workspace and refuse to build it.
          path: |
            ~/.cache/coincube/electrs-blake2b/target/release/electrs
            ~/.cache/coincube/electrs-blake2b/target/.built-${{ env.ELECTRS_BLAKE2B_COMMIT }}-v2
          # "-v2": the marker format changed with the clean-source check;
          # actions/cache never overwrites an existing key, so the old entry
          # (binary + pre-repair marker) must not be the one restored.
          key: ${{ runner.os }}-electrs-blake2b-v2-${{ env.ELECTRS_BLAKE2B_COMMIT }}

      - name: Build coincubed
        # The block-file probe drives one Knots node over JSON-RPC and needs no
        # daemon, so a probe-only reproduction run skips the build entirely.
        if: ${{ !inputs.probe_only }}
        run: |
          cargo build --release --package coincubed
          cargo build --release --package coincube-core --example claim_regtest_vectors
          cargo build --release --package coincube-core --example split_regtest_vectors

      - name: Build headless Claim panel test driver
        if: ${{ !inputs.probe_only }}
        env:
          BREEZ_API_KEY: DUMMY_BREEZ_API_KEY
          # Release compilation requires a default; harness clients inject their local server.
          COINCUBE_API_URL: https://claim-harness.invalid
        run: |
          cargo test --release --locked --package coincube-gui --lib --features regtest-harness --no-run --message-format=json-render-diagnostics > claim-gui-build.json
          driver="$(jq -ser '[.[] | select(.reason == "compiler-artifact" and .target.name == "coincube_gui" and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else error("expected one GUI test executable") end' claim-gui-build.json)"
          test -x "$driver"
          echo "CLAIM_GUI_REGTEST_TEST_PATH=$driver" >> "$GITHUB_ENV"

      - name: Test and build knots_verify
        # The verifier decides which node binaries the harness may execute, so
        # its own tests (real signed manifest, tampered/garbled/missing
        # signature, wrong pin, filename/hash mismatch) run on every job.
        run: |
          cd tests/tools/knots_verify
          cargo test --release --locked
          cargo build --release --locked

      - name: Fetch and verify both Bitcoin Knots releases
        # Each archive's checksum must be listed in the release SHA256SUMS and
        # SHA256SUMS.asc must verify against the Knots signing key the desktop
        # vendors (coincube-gui/assets/knots_signing_key.asc). This runs on
        # every job, cache hit or not; nothing is extracted or reused otherwise
        # — a stand-in node would make the B4.2 rows lie.
        # Assign first, then export: `echo "X=$(cmd)"` succeeds even when cmd
        # fails, which would export an empty path and let the harness skip.
        run: |
          set -e
          legacy="$(tests/tools/fetch_knots.sh "$KNOTS_LEGACY_VERSION")"
          blake2b="$(tests/tools/fetch_knots.sh "$KNOTS_BLAKE2B_VERSION")"
          test -x "$legacy" && test -x "$blake2b"
          echo "KNOTS_LEGACY_PATH=$legacy" >> "$GITHUB_ENV"
          echo "KNOTS_BLAKE2B_PATH=$blake2b" >> "$GITHUB_ENV"

      - name: Build retropex/electrs (BLAKE2b-aware Esplora indexer)
        if: ${{ !inputs.probe_only }}
        run: |
          set -e
          electrs="$(tests/tools/fetch_electrs_blake2b.sh)"
          test -x "$electrs"
          echo "ELECTRS_BLAKE2B_PATH=$electrs" >> "$GITHUB_ENV"

      - name: Run the two-chain harness
        env:
          VERBOSE: 0
          LOG_LEVEL: debug
          TIMEOUT: 120
          # A missing binary fails the run instead of skipping the tests.
          BTCB2_HARNESS_REQUIRED: "1"
          CLAIM_REGTEST_TOOL_PATH: ${{ github.workspace }}/target/release/examples/claim_regtest_vectors
          SPLIT_REGTEST_TOOL_PATH: ${{ github.workspace }}/target/release/examples/split_regtest_vectors
          # Failing tests keep their datadirs here so the logs can be collected.
          TEST_DIR: ${{ github.workspace }}/test-datadirs
          # Per-thread syscall tracing of the Knots nodes, dispatch-only (#394).
          # `inputs` is empty on a pull_request, so this is "0" there.
          BTCB2_TRACE_SYSCALLS: ${{ inputs.trace_syscalls && '1' || '0' }}
          PROBE_ONLY: ${{ inputs.probe_only && '1' || '0' }}
          REPEAT: ${{ inputs.repeat || '1' }}
          # Empty means "use the module's default"; the probe reads these.
          BTCB2_BLOCKFILE_THREADS: ${{ inputs.probe_threads }}
          BTCB2_BLOCKFILE_BATCH: ${{ inputs.probe_batch }}
          BTCB2_BLOCKFILE_ROUNDS: ${{ inputs.probe_rounds }}
        run: |
          set -xe
          mkdir -p "$TEST_DIR"
          "$KNOTS_LEGACY_PATH" --version | head -1
          # B4.1 proves the harness; B4.2 runs the QA matrices on it; the three
          # test_btcb2_claim_* modules run Claim end to end on both chains;
          # test_btcb2_split_consensus.py runs Split step 1 on both (#568);
          # test_btcb2_blockfile.py drives concurrent getblock batches at one
          # node to reproduce the block-file fault in #394. The modules are
          # named explicitly: a bare `pytest tests/` here would also pull in
          # the functional suite, which this job does not set up.
          modules="tests/test_btcb2_harness.py tests/test_btcb2_b42_matrices.py tests/test_btcb2_blockfile.py tests/test_btcb2_claim_consensus.py tests/test_btcb2_claim_ancestry_consensus.py tests/test_btcb2_claim_gui.py tests/test_btcb2_split_consensus.py"
          # The stress reproduction itself runs only when it is asked for: it
          # reproduces a node defect nothing here can fix, about one attempt in
          # eight, and a pull request is not the place to discover that. Its
          # no-node regressions still run everywhere.
          select=(-m "not probe")
          if [ "$PROBE_ONLY" = "1" ]; then
            modules="tests/test_btcb2_blockfile.py"
            select=()
          else
            "$KNOTS_BLAKE2B_PATH" --version | head -1
          fi
          case "$REPEAT" in
            ''|*[!0-9]*) echo "repeat must be a whole number" >&2; exit 2 ;;
          esac
          # An empty override must not reach the probe as `int("")`.
          for knob in BTCB2_BLOCKFILE_THREADS BTCB2_BLOCKFILE_BATCH \
                      BTCB2_BLOCKFILE_ROUNDS; do
            eval "value=\${$knob}"
            if [ -z "$value" ]; then
              unset "$knob"
            else
              case "$value" in
                ''|*[!0-9]*|0) echo "$knob must be a positive number" >&2; exit 2 ;;
              esac
            fi
          done
          if [ "$REPEAT" -lt 1 ] || [ "$REPEAT" -gt 10 ]; then
            echo "repeat must be between 1 and 10; these are Actions minutes" >&2
            exit 2
          fi
          # Stops at the first failure: with an intermittent fault the first
          # reproduction is the one whose datadir and trace must be kept.
          for attempt in $(seq 1 "$REPEAT"); do
            echo "::group::attempt $attempt of $REPEAT"
            pytest $modules "${select[@]}" -vvv --junitxml="$TEST_DIR/btcb2.xml" -o junit_family=legacy
            echo "::endgroup::"
          done

      - name: Collect logs from failed tests
        if: failure()
        run: |
          set -x
          dest="$GITHUB_WORKSPACE/failure-logs"
          mkdir -p "$dest"
          cd "$GITHUB_WORKSPACE/test-datadirs" || exit 0
          # blk*.dat rides along so the bytes at the position the node could
          # not seek to can be checked offline, and strace-excerpt.log is the
          # failing descriptor's history, already correlated by the test.
          # xor.dat is what makes blk*.dat readable at all: Bitcoin Core 28+
          # obfuscates block files with the key kept there, so without it the
          # preserved bytes cannot be decoded without guessing the key from a
          # known record.
          find . -type f \( -name 'log' -o -name 'debug.log' \
            -o -name 'strace-excerpt.log' -o -name 'blk*.dat' \
            -o -name 'xor.dat' \) -size -50M |
            while read -r f; do
              mkdir -p "$dest/$(dirname "$f")"
              cp "$f" "$dest/$f"
            done
          # The full syscall trace is the one file the size cap must not drop.
          # Run 36381534801 reproduced #394 and lost its trace to that cap; it
          # compresses about twentyfold, so it goes in gzipped rather than not
          # at all.
          find . -type f -name 'strace.log' |
            while read -r f; do
              mkdir -p "$dest/$(dirname "$f")"
              gzip -c "$f" > "$dest/$f.gz"
            done
          du -sh "$dest"

      - name: Upload logs from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-btcb2-harness
          path: failure-logs
          retention-days: 14
          if-no-files-found: warn

      - name: Upload two-chain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcb2-test-results
          path: test-datadirs/btcb2.xml
          retention-days: 14
          if-no-files-found: warn
