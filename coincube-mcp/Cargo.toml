[package]
name = "coincube-mcp"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

[features]
default = []
# Only companion builds paired with the experimental native Regtest workflow.
native-proposals = []
native-transactions = []
adapter = ["dep:rmcp"]

[[bin]]
name = "tenshu-mcp"
path = "src/main.rs"
required-features = ["adapter"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }
rand = "0.8"
subtle = "2"
tempfile = "3"
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "server", "transport-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }
