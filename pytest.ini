[pytest]
testpaths = tests
# The USB/Appium suite has its own pinned environment and explicit entry point.
# Keep pytest's default exclusions; explicit tests/e2e/run targets still collect.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} tests/e2e
markers =
    probe: a deliberate stress reproduction, run only when asked for. #394 is a
        node defect no change here can fix, so a test that can go red for it
        must not sit in the path of unrelated work - that blast radius is the
        complaint the issue was filed about.
